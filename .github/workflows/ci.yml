name: CI
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: fast, merge (the gate a landing passes) or release (the full matrix, nightly and before a cut)
        type: choice
        options: [fast, merge, release]
        default: fast
      land:
        description: Fast-forward main to this commit when the merge tier passes
        type: boolean
        default: true
      status-only:
        description: Verify the recorded merge or release tier for this exact commit
        type: boolean
        default: false
  pull_request:
  merge_group:
concurrency:
  # Main status runs must not share the replaceable branch queue.
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-status-{0}', github.run_id) || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  gate:
    uses: pedronaugusto/preflight/.github/workflows/zig.yml@cb348117bc08b298276d51a00dbbfe83e79570a7
    # Only the job that lands a green merge run writes (`land` in ci/workflow.json), and only to move main.
    permissions:
      contents: write
      actions: read
    with:
      tier: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || github.event_name == 'schedule' && 'release' || 'merge' }}
      working-directory: "."
      preflight-ref: cb348117bc08b298276d51a00dbbfe83e79570a7
      attest: ${{ github.event_name == 'push' || inputs.status-only }}
      land: ${{ github.event_name == 'workflow_dispatch' && inputs.land }}
